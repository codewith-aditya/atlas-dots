appId: com.atlasdots.app
name: Thread error recovery
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ATLAS_DOTS_ACTIVE_EMAIL: ${ATLAS_DOTS_SCREENSHOT_EMAIL}
- openLink: "atlasdots:///thread?botId=${ATLAS_DOTS_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*weekly limit.*"
    timeout: 20000
- assertVisible: "Add Model"
- assertNotVisible: "Change model"
- takeScreenshot: 01-limit-banner
- tapOn: "Details"
- extendedWaitUntil:
    visible: ".*reply stopped at its key's weekly limit.*"
    timeout: 10000
- takeScreenshot: 02-limit-details
